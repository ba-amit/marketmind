name: Morning report

on:
  schedule:
    - cron: "40 3 * * 1-5" # 09:10 IST, after NSE's 09:00-09:08 pre-open session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Run pipeline
        run: uv run python -m mm.run

      - name: Publish to docs/
        run: |
          TODAY=$(date -u +%F)
          mkdir -p docs/archive
          for target in docs/index.md "docs/archive/${TODAY}.md"; do
            { printf -- '---\ntitle: Morning Market Report\n---\n\n'
              cat "reports/${TODAY}.md"
            } > "$target"
          done
          # rebuild archive index
          { printf -- '---\ntitle: Archive\n---\n\n# Report archive\n\n'
            ls docs/archive | sort -r | sed 's/\.md$//' \
              | awk '{print "- [" $1 "](archive/" $1 ".html)"}'
          } > docs/archive.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "report: $(date -u +%F)"
          git push
